# Termine. Any order; the page sorts them by date. Leave past shows in: the page
# moves them under "Vergangene Termine" by itself once their date has passed.
#
# Copy a block (from "- date" down), change the values, commit.
# The site rebuilds in about a minute.
#
#   date       e.g. 2026-12-05 (no quotes)
#   city       "Rosenheim"
#   venue      "asta Kneipe"
#   url        optional, the event page; the venue name links to it
#   cancelled  optional, true strikes the show through and shows "abgesagt"

# - date: 2027-04-04
#   city: "Rosenheim"
#   venue: "asta Kneipe"
#   url: "https://astakneipe.de"

